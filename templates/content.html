<p>Copy this link into your Podcast App: <a id="rsslink" href="./rss/{{ .playlist_id }}">RSS-Feed</a>
    <button class="copy-btn" id="copy-btn" aria-label="Copy link">📋</button>
</p>
<form hx-post="/audio" hx-target="#audio-list" hx-target-error="#popup-container">
    <fieldset>
        <legend>Add Media</legend>
        <label for="media_url">URL from youtube or archive.org</label>
        <input type="url" id="media_url" name="media_url" placeholder="https://www.youtube.com/watch?v=rMqfD2vInLo"
            required>
        <button type="submit" hx-indicator="#indicator">Add Media</button>
    </fieldset>
</form>

<div id="playlist-menu">
    <div class="playlist-selector" id="playlist-selector">
        {{ template "playlist.html" . }}
    </div>
    <button id="delete-playlist-btn" type="button" hx-delete="api/v1/playlist" hx-include="#playlist-select"
        hx-confirm="Are you sure you want to delete this playlist? All Media will move to the default playlist."
        hx-target="#playlist-selector">
        Delete
    </button>
    <button id="new-playlist-btn" type="button"
        hx-on:click="const form=document.getElementById('new-playlist-form');form.style.display='block';document.getElementById('playlist-name').focus()">+
        New</button>
    <div id="new-playlist-form" style="display: none;">
        <form hx-post="/playlist" hx-target="#playlist-selector" hx-target-error="#popup-container">
            <fieldset>
                <legend>Create New Playlist</legend>
                <label for="playlist-name">Name</label>
                <input type="text" id="playlist-name" name="name" placeholder="Enter Name" maxlength=120 required>
                <button type="submit"
                    hx-on:click="const form=document.getElementById('new-playlist-form');form.style.display='none'">Create</button>
                <button type="button" id="cancel-playlist-btn"
                    hx-on:click="const form=document.getElementById('new-playlist-form');form.style.display='none'">Cancel</button>
            </fieldset>
        </form>
    </div>
</div>

<h2>Playlist <span class="playlist-name">{{ .playlist_name }}</span></h2>
<div id="audio-list">
    {{ template "itemlist.html" . }}
</div>

<details>
    <summary>
        <strong>Events</strong>
    </summary>

    <ul id="items"></ul>
</details>

<script>
    const evtSource = new EventSource("/events");

    evtSource.onmessage = function (e) {
        try { data = JSON.parse(e.data); }
        catch { return console.warn("Invalid SSE message", e.data); }
        const id = data.id;
        let item = document.querySelector(`.item[data-id='${id}']`);

        if (!item) {
            item = document.createElement('details');
            item.className = 'item';
            item.dataset.id = id;

            item.innerHTML = `
                <summary>
                    <strong>${data.id}</strong>
                    <span class="progress">${data.progress}%</span>
                    <span class="status">${data.status}</span>
                </summary>
                <div><strong>Title:</strong> <span class="title">${data.title || "N/A"}</span></div>
                <div><strong>Source:</strong> <span class="source">${data.source_url || "N/A"}</span></div>
            `;
            // Add new item to the top of the list
            const itemsList = document.getElementById('items');
            itemsList.prepend(item);
            // Fade in
            item.style.opacity = 0;
            requestAnimationFrame(() => item.style.transition = 'opacity 0.5s');
            requestAnimationFrame(() => item.style.opacity = 1);
        } else {
            // Update existing item
            item.querySelector(".progress").textContent = data.progress + "%";
            item.querySelector(".status").textContent = data.status;
            item.querySelector(".title").textContent = data.title;
            item.querySelector(".source").textContent = data.source_url;
            if (data.done) {
                item.querySelector(".status").textContent = "✅ Done";
            }
            if (data.error && data.error !== "") {
                item.querySelector(".status").textContent = "❌ " + data.error;
            }
        }
        htmx.trigger('.table', 'refresh')
    };

    const btn = document.getElementById('copy-btn');
    btn.addEventListener('click', () => {
        const url = document.getElementById('rsslink').href;
        navigator.clipboard.writeText(url).then(() => {
            console.log('copied');
            btn.classList.add('copied');
            setTimeout(() => btn.classList.remove('copied'), 300);
        }).catch(console.error);
    });

</script>
